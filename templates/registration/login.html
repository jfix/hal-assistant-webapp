{% extends "base.html" %}

{% block title %}Sign in · HAL Publication Manager{% endblock %}

{% block content %}
  <section class="login-panel">
    <p class="eyebrow">Trusted reviewer access</p>
    <h1>Sign in</h1>
    {% if form.errors %}
      <div class="alert" role="alert">The username or password was not recognised.</div>
    {% endif %}
    <form method="post" class="stack">
      {% csrf_token %}
      <label>
        Username
        {{ form.username }}
      </label>
      <label>
        Password
        {{ form.password }}
      </label>
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button class="primary-button" type="submit">Sign in</button>
    </form>
  </section>
{% endblock %}
