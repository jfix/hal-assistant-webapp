{% extends "base.html" %}

{% block title %}Modifier mon mot de passe · Gestionnaire de publications HAL{% endblock %}

{% block content %}
  <div class="page-heading"><div><p class="eyebrow">Mon compte</p><h1>Modifier mon mot de passe</h1></div></div>
  <section class="panel narrow-panel">
    <form method="post" class="stacked-form">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label>{{ field.label }}{{ field }}{{ field.errors }}{% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}</label>
      {% endfor %}
      <button class="primary-button" type="submit">Modifier mon mot de passe</button>
    </form>
  </section>
{% endblock %}
